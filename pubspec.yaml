name: crm_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  pdf: ^3.10.7
  file_saver: ^0.3.1
  http: ^1.2.0
  intl: ^0.20.2

  flutter_local_notifications: ^16.3.2

  firebase_core: ^4.1.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.0.1
  cloud_firestore: ^6.10.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  file_picker: ^11.0.3
  firebase_storage: ^13.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Roboto (Apache 2.0) används i PDF-exporten, som annars saknar
  # kyrilliska och turkiska tecken.
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
